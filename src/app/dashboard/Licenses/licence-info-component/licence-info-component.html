<div class="trezo-card-content">
    <div class="table-style-two">
        <div class="basic-table table-responsive">
            <table class="table mb-0">
                <thead>
                    <tr>
                        <th class="fw-medium sortable">Device Model</th>
                        <th class="fw-medium sortable">MAC Address</th>
                        <th class="fw-medium sortable">Plan</th>
                        <th class="fw-medium sortable">Concurrent Calls</th>
                        <th scope="col" class="fw-medium">Expire Date</th>
                        <th scope="col" class="fw-medium">User Email</th>

                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="px-6 py-4 font-medium text-gray-700 ">{{ licenceDetails?.model}}</td>
                        <td class="px-6 py-4 text-gray-700">{{ licenceDetails?.mac }}</td>
                        <td class="px-6 py-4 text-gray-700">{{ licenceDetails?.plan }}</td>
                        <td class="px-6 py-4 text-gray-700">{{ licenceDetails?.concurrentCalls }}</td>
                        <td class="px-6 py-4 text-gray-700">{{ licenceDetails?.expireDate }}</td>
                        <td class="px-6 py-4 text-gray-700">{{ licenceDetails?.userEmail }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
