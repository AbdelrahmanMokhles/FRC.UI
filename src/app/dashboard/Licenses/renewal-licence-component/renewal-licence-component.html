<!-- Breadcrumb -->
<section>
    <div class="breadcrumb-card mb-25 d-md-flex align-items-center justify-content-between">
        <h5 class="mb-0">
            Licence Renewal
        </h5>
        <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
            <li class="breadcrumb-item d-inline-block position-relative">
                <a routerLink="/dashboard" class="d-inline-block position-relative">
                    <i class="material-symbols-outlined">
                        home
                    </i>
                    Dashboard
                </a>
            </li>
            <li class="breadcrumb-item d-inline-block position-relative">
                <span routerLink="/dashboard/licences/licences-list">
                    Licence
                </span>
            </li>
            <li class="breadcrumb-item d-inline-block position-relative">
                Device Subscription
            </li>
        </ol>
    </div>
</section>
<!-- End Breadcrumb -->


<!-- Form -->
<section>
    <div class="col-lg-12">
        <div class="trezo-card border-radius d-block bg-white border-0 shadow-none">
            <div class="trezo-card-content">
                <form class="row g-4" [formGroup]="upgradeForm" (ngSubmit)="renew()" novalidate>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Model Name</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="model">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">MAC Address</label>
                        <input type="text" class="form-control disabled-look" formControlName="mac" readonly id="model">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Current Plan</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="currentPlan">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Concurrent Calls</label>
                        <input type="text" formControlName="concurrentCalls" class="form-control disabled-look" readonly
                            id="model">
                    </div>
                    <div class="col-md-3">
                        <label for="model" class="form-label">User Email</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="userEmail">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Period of renewal</label>
                        <input type="number" class="form-control disabled-look" readonly id="model"
                            formControlName="tier">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Period Multiplier</label>
                        <select (change)="onMultiplierChange($any($event.target).value)" formControlName="multiplier"
                            class="form-select" name="planPeriods" id="planPeriods">
                            <option>1</option>
                            <option>2</option>
                            <option>3</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Current Expiration Date</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="currentExpireDate">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">New Expiration Date</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="newExpireDate">
                    </div>
                    <div class="col-md-1">
                        <label for="model" class="form-label">Price</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="price">
                    </div>
                    <div class="col-md-2">
                        <label for="model" class="form-label">Disti Discount</label>
                        <input type="text" class="form-control disabled-look" readonly id="model"
                            formControlName="distiDiscount">
                    </div>
                    <div class="my-8 border-t border-gray-200"></div>
                    <div class="trezo-card-content example-buttons">
                        <button type="submit" [disabled]="upgradeForm.invalid" class="btn btn-primary">
                            Renewal
                        </button>
                        <a type="button" routerLink="/dashboard/licences/licences-list"
                            class="btn btn-danger">Cancel</a>
                    </div>
                </form>

            </div>

        </div>
    </div>
</section>

<!-- Form -->
